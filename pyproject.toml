[project]
name = "claude-skill-design"
version = "0.1.0"
description = "Claude Code skills for designing and building web interfaces."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "axe-playwright-python==0.1.8",
    "coverage==7.17.0",
    "mypy==2.3.0",
    "playwright==1.64.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.2",
    "vulture==2.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/web-ui-craft/scripts", "bench"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "N", "C90", "PLR"]

[tool.ruff.lint.isort]
known-first-party = ["capture", "check_budgets", "check_slop", "pairs", "score", "views"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# pytest's assertion rewriting relies on bare assert, and test tables use literal values.
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
files = ["skills", "bench", "tests"]
mypy_path = "skills/web-ui-craft/scripts:bench"
# Bench rounds copy each arm's skill, scripts included, into this ignored folder.
exclude = ["^bench/runs/"]

# axe-playwright-python ships no type information.
[[tool.mypy.overrides]]
module = ["axe_playwright_python.*"]
ignore_missing_imports = true
