[project]
name = "claude-skill-design"
version = "0.1.0"
description = "Claude Code skills for designing and building web interfaces."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.16.2",
    "vulture==2.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/web-ui-craft/scripts"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "N", "C90", "PLR"]

[tool.ruff.lint.isort]
known-first-party = ["check_budgets", "check_slop"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# pytest's assertion rewriting relies on bare assert, and test tables use literal values.
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
files = ["skills", "tests"]
mypy_path = "skills/web-ui-craft/scripts"
